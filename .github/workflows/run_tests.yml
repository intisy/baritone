name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      java_version: '21'
      gradle_test: 'test'
      # unimined configures Minecraft eagerly per Stonecutter node, so a whole-tree test run sets
      # up one Minecraft per version node and is slow rather than merely long.
      timeout_minutes: 120
