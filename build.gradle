// Root is now a pure aggregator. The shared baritone code lives in the Stonecutter
// version node ':common:<version>' (see common/build.gradle + common/stonecutter.gradle);
// the loaders (fabric/forge/neoforge/tweaker) bundle the ACTIVE ':common' node's outputs.
//
// This allprojects{} block supplies the shared java/unimined config to the LOADERS only.
// It skips:
//   - rootProject itself (aggregator, holds no code / no source sets), and
//   - the whole ':common' tree, which self-configures (the controller ':common' must stay
//     non-buildable, and the version node needs immediate unimined apply — see
//     common/build.gradle).
// --- Per-version constants (Stonecutter) -------------------------------------
// The active Stonecutter version node (common/versions/<version>) auto-loads its own
// gradle.properties, so the node's build script reads project.minecraft_version /
// project.java_version directly. The loaders (fabric/forge/neoforge/tweaker) are NOT
// Stonecutter nodes and cannot auto-load, and the shared allprojects{} config below also
// needs the active minecraft_version / java_version. We therefore resolve the ACTIVE
// version from the controller (common/stonecutter.gradle, the source of truth that the
// "Set active project to <ver>" task rewrites) and load that version's constants into the
// root project so every loader reads the active values. A fresh build after an active
// switch re-resolves these.
def activeVersionMatcher = (file('common/stonecutter.gradle').text =~ /active\(\s*['"]([^'"]+)['"]\s*\)/)
if (!activeVersionMatcher.find()) {
    throw new GradleException("Could not determine the active Stonecutter version from common/stonecutter.gradle")
}
def activeVersion = activeVersionMatcher.group(1)
def activeVersionProps = new Properties()
file("common/versions/${activeVersion}/gradle.properties").withInputStream { activeVersionProps.load(it) }
activeVersionProps.each { key, value ->
    def name = key.toString()
    // Skip keys already defined at root (e.g. available_loaders is kept in root
    // gradle.properties for settings.gradle's include loop).
    if (!rootProject.hasProperty(name)) {
        rootProject.ext.set(name, value.toString())
    }
}

// The ACTIVE version's loader set. Root gradle.properties' `available_loaders` is the UNION of
// every version's loaders (settings.gradle includes that superset so all loader subprojects
// exist regardless of active version). `active_loaders` is the ACTIVE version's own subset —
// each loader self-skips (below and in its own build.gradle) when it is not listed, so a version
// only builds the loaders that work under the unified unimined toolchain.
rootProject.ext.active_loaders = (activeVersionProps.getProperty('available_loaders') ?: rootProject.available_loaders)
        .split(',').collect { it.trim() }.findAll { it }

allprojects {
    if (project == rootProject || project.path.startsWith(':common')) {
        return
    }
    // Per-version loader scoping: skip loaders the ACTIVE version does not list. This withholds
    // the java/unimined config below, so an unscoped loader compiles nothing and produces no jar
    // (its own build.gradle also early-returns). Keeps e.g. neoforge inert on versions whose
    // NeoForge cannot configure under this unimined.
    if (!rootProject.active_loaders.contains(project.name)) {
        return
    }

    apply plugin: 'java'
    apply plugin: "xyz.wagyourtail.unimined"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name

    def vers = ""
    try {
        vers = 'git describe --always --tags --first-parent --dirty'.execute().text.trim()
    } catch (Exception e) {
        println "Version detection failed: " + e
    }
    if (!vers.startsWith("v")) {
        println "using version number: " + rootProject.mod_version
        version = rootProject.mod_version
    } else {
        version = vers.substring(1)
        println "Detected version " + version
    }
    group = rootProject.maven_group

    sourceCompatibility = targetCompatibility = JavaVersion.toVersion(rootProject.java_version)

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
        }
    }

    repositories {
        maven {
            url = "https://files.minecraftforge.net/maven/"
        }
        maven {
            name = 'spongepowered-repo'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'fabric-maven'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'impactdevelopment-repo'
            url = 'https://impactdevelopment.github.io/maven/'
        }
        maven {
            name = "ldtteam"
            url = "https://maven.parchmentmc.net/"
        }
        // for the newer version of launchwrapper
        maven {
            name = "multimc-maven"
            url = "https://files.multimc.org/maven/"
            metadataSources {
                artifact()
            }
        }
        mavenCentral()
        maven {
            name = 'babbaj-repo'
            url = 'https://babbaj.github.io/maven/'
        }
    }

    dependencies {
        compileOnly "org.spongepowered:mixin:${project.mixin_version}"
        compileOnly "org.ow2.asm:asm:${project.asm_version}"

        implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"

        implementation 'com.google.code.findbugs:jsr305:3.0.2'
    }

    unimined.minecraft(sourceSets.main, true) {
        version rootProject.minecraft_version

        mappings {
            intermediary()
            mojmap()
            parchment(rootProject.minecraft_version, rootProject.parchment_version)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"

        def targetVersion = rootProject.java_version.toInteger()
        if (JavaVersion.current().isJava9Compatible()) {
            it.options.release = targetVersion
        }
    }
}
