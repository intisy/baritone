import baritone.gradle.task.CreateDistTask
import baritone.gradle.task.ProguardTask

plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
}

archivesBaseName = archivesBaseName + "-forge"

unimined.minecraft {
    minecraftForge {
        // Per-version loader constant, loaded into root from the active version node
        // (see build.gradle). Loaders are not Stonecutter nodes so they read it from root.
        loader rootProject.forge_version
        mixinConfig ["mixins.baritone.json"]
    }
}

//loom {
//    forge {
//        mixinConfig 'mixins.baritone.json'
//    }
//}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

// Resolve the ACTIVE ':common' Stonecutter version node, configured before we read its outputs.
evaluationDependsOn(':common')
def commonNode = project(":common:${project(':common').stonecutter.current.version}")
evaluationDependsOn(commonNode.path)

dependencies {
    // Bundle the ACTIVE ':common' node's outputs (multiple sourcesets => `common project(...)` won't work).
    for (sourceSet in commonNode.sourceSets) {
        if (sourceSet == commonNode.sourceSets.test) continue
        if (sourceSet == commonNode.sourceSets.schematica_api) continue
        common sourceSet.output
        shadowCommon sourceSet.output
    }
    shadowCommon "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"

    manifest {
        attributes(
                'MixinConfigs': 'mixins.baritone.json',
                "MixinConnector": "baritone.launch.BaritoneMixinConnector",

                'Implementation-Title': 'Baritone',
                'Implementation-Version': version,
        )
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

task proguard(type: ProguardTask) {
    proguardVersion "7.4.2"
    compType "forge"
}

task createDist(type: CreateDistTask, dependsOn: proguard) {
    compType "forge"
}

build.finalizedBy(createDist)

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}