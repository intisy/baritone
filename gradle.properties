org.gradle.jvmargs=-Xmx4G

# Loader list for settings.gradle's include loop (settings-eval time, before any project
# is configured). Kept in root because settings.gradle cannot read a per-version node file.
# The identical list also lives in each common/versions/<version>/gradle.properties.
available_loaders=fabric,forge,neoforge,tweaker

# Genuinely shared across all Minecraft versions.
mod_version=1.17.0
maven_group=baritone
archives_base_name=baritone

nether_pathfinder_version=1.4.1

# The following per-version constants moved to common/versions/<version>/gradle.properties
# (Stonecutter auto-loads them per node; loaders read the active version's values via root):
#   minecraft_version, java_version, forge_version, neoforge_version, fabric_version

// These dependencies are used for common and tweaker
// while mod loaders usually ship their own version
mixin_version=0.8.7
asm_version=9.7
