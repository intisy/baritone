// Applied by each loader's PER-NODE script (<loader>/build.gradle under a Stonecutter version
// node). Every node reaching here is supported: settings.gradle gives each loader only the
// versions that declare it.

def versionProps = new Properties()
rootProject.file("common/versions/${stonecutter.node.metadata.version}/gradle.properties")
        .withInputStream { versionProps.load(it) }

ext.nodeVersion = stonecutter.node.metadata.version
ext.loaderName = project.parent.name
ext.loaderVersion = versionProps.getProperty("${ext.loaderName}_version")
ext.commonNode = project(":common:${ext.nodeVersion}")

// Names the loader in artifact and dist file names. tweaker alone publishes unsuffixed, and opts
// out by setting this to null before applying this script.
if (!ext.has('distClassifier')) {
    ext.distClassifier = ext.loaderName
}
def distClassifier = ext.distClassifier

def minecraftVersion = versionProps.getProperty('minecraft_version')
def javaVersion = versionProps.getProperty('java_version')
def parchmentVersion = versionProps.getProperty('parchment_version')

// ProguardTask resolves its toolchain from a project property of exactly this name.
ext.java_version = javaVersion

apply plugin: 'java'
apply plugin: "xyz.wagyourtail.unimined"
apply plugin: "maven-publish"

archivesBaseName = rootProject.archives_base_name + (distClassifier != null ? "-${distClassifier}" : "")
group = rootProject.maven_group

apply from: rootProject.file('gradle/mod-version.gradle')
version = ext.baritoneVersion

sourceCompatibility = targetCompatibility = JavaVersion.toVersion(javaVersion)

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
    }
}

apply from: rootProject.file('gradle/mc-repositories.gradle')

dependencies {
    compileOnly "org.spongepowered:mixin:${rootProject.mixin_version}"
    compileOnly "org.ow2.asm:asm:${rootProject.asm_version}"

    implementation "dev.babbaj:nether-pathfinder:${rootProject.nether_pathfinder_version}"

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

evaluationDependsOn(ext.commonNode.path)

// Captured before the closure below, whose delegate is unimined's config rather than the project.
def loaderBlock = ext.has('loaderBlock') ? ext.loaderBlock : null
def loaderVersion = ext.loaderVersion

// Immediate apply, never the lateApply overload: a Stonecutter version node swallows unimined's
// deferred afterEvaluate and fails with "minecraft config never applied for source set 'main'".
unimined.minecraft(sourceSets.main) {
    version minecraftVersion

    mappings {
        intermediary()
        mojmap()
        // Optional, see the same guard in common/build.gradle.
        if (parchmentVersion != null) {
            parchment(minecraftVersion, parchmentVersion)
        }
    }

    if (loaderBlock != null) {
        loaderBlock.delegate = delegate
        loaderBlock.resolveStrategy = Closure.DELEGATE_FIRST
        loaderBlock(loaderVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = javaVersion.toInteger()
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    // Multiple sourcesets, so `common project(...)` won't work.
    for (sourceSet in commonNode.sourceSets) {
        if (sourceSet == commonNode.sourceSets.test) continue
        if (sourceSet == commonNode.sourceSets.schematica_api) continue
        common sourceSet.output
        shadowCommon sourceSet.output
    }
}

if (ext.has('metadataFile')) {
    def metadataFile = ext.metadataFile
    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", nodeVersion

        filesMatching(metadataFile) {
            expand "version": project.version, "minecraft_version": nodeVersion
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

if (ext.has('mixinManifest') && ext.mixinManifest) {
    jar {
        manifest {
            attributes(
                    'MixinConfigs': 'mixins.baritone.json',
                    "MixinConnector": "baritone.launch.BaritoneMixinConnector",

                    'Implementation-Title': 'Baritone',
                    'Implementation-Version': version,
            )
        }
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

task proguard(type: baritone.gradle.task.ProguardTask) {
    proguardVersion "7.4.2"
    if (distClassifier != null) {
        compType distClassifier
    }
}

task createDist(type: baritone.gradle.task.CreateDistTask, dependsOn: proguard) {
    if (distClassifier != null) {
        compType distClassifier
    }
}

build.finalizedBy(createDist)

publishing {
    publications {
        mavenLoader(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + loaderName + "-" + nodeVersion
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
