// Applied by every project that resolves Minecraft: the ':common' version nodes and, through
// gradle/loader-conventions.gradle, the loader version nodes. Must be applied BEFORE unimined,
// which adds a parchmentmc repository of its own that the hook below has to catch.

// parchmentmc hosts only mapping data, but is otherwise probed for every cache miss and is slow
// enough to time out and fail resolution outright.
repositories.whenObjectAdded { repo ->
    if (repo instanceof MavenArtifactRepository && repo.url?.host?.contains('parchmentmc')) {
        repo.content {
            includeGroup "org.parchmentmc.data"
        }
    }
}

repositories {
    maven {
        url = "https://files.minecraftforge.net/maven/"
    }
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'fabric-maven'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'impactdevelopment-repo'
        url = 'https://impactdevelopment.github.io/maven/'
    }
    maven {
        name = "ldtteam"
        url = "https://maven.parchmentmc.net/"
    }
    // for the newer version of launchwrapper
    maven {
        name = "multimc-maven"
        url = "https://files.multimc.org/maven/"
        metadataSources {
            artifact()
        }
    }
    mavenCentral()
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
}
