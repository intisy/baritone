plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
}

ext.loaderBlock = { loaderVersion ->
    runs {
        config("client") {
            mainClass = "net.minecraft.launchwrapper.Launch"
            args.addAll(["--tweakClass", "baritone.launch.tweaker.BaritoneTweaker"])
        }
    }
}
ext.mixinManifest = true
// Published unsuffixed, unlike every other loader.
ext.distClassifier = null

apply from: rootProject.file('gradle/loader-conventions.gradle')

dependencies {
    implementation "org.spongepowered:mixin:${rootProject.mixin_version}"

    // for some reason mixin isn't including these...
    implementation "org.ow2.asm:asm:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-tree:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-commons:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-util:${rootProject.asm_version}"
    implementation "org.ow2.asm:asm-analysis:${rootProject.asm_version}"

    implementation 'com.github.ImpactDevelopment:SimpleTweaker:1.2'
    implementation('net.minecraft:launchwrapper:of-2.3') {
        exclude module: 'lwjgl'
        exclude module: 'asm-debug-all'
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
