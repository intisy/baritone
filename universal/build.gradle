plugins {
    id 'io.github.intisy.nylium' version '0.1.0-SNAPSHOT'
}

// The plugin resolves nylium-api, nylium-core and one bootstrap per declared platform as Maven
// coordinates into its own nyliumEmbed configuration, so this project needs its own repositories.
repositories {
    mavenLocal()
    mavenCentral()
}

apply from: rootProject.file('gradle/mod-version.gradle')
version = ext.baritoneVersion

base {
    archivesName = rootProject.archives_base_name
}

// Not a Stonecutter dimension: there is exactly one universal jar across every version.
//
// neoforge and tweaker are deliberately absent. NeoForge needs a bootstrap Nylium does not have
// yet (its SP-1b), and tweaker is LaunchWrapper, which dispatches correctly and then crashes the
// server (Nylium's limitation 4). Both would ship a module that cannot work.
def moduleSources = [
        ['fabric', '1.21.11', 'FABRIC'],
        ['fabric', '1.21.10', 'FABRIC'],
        ['fabric', '1.21.8', 'FABRIC'],
        ['fabric', '1.21.5', 'FABRIC'],
        ['forge', '1.21.11', 'MODLAUNCHER_9'],
        ['forge', '1.21.10', 'MODLAUNCHER_9'],
        ['forge', '1.21.8', 'MODLAUNCHER_9'],
        ['forge', '1.21.5', 'MODLAUNCHER_9'],
]

moduleSources.each { loader, minecraftVersion, platform ->
    evaluationDependsOn(":${loader}:${minecraftVersion}")
}

nylium {
    mod {
        id = 'baritone'
        name = 'Baritone'
        version = project.version
        description = 'Google Maps for Blockgame'
        license = 'LGPL-3.0'
        authors = ['leijurv', 'Brady']
    }

    moduleSources.each { loader, minecraftVersion, platform ->
        module("${loader}-${minecraftVersion}") {
            jar = project(":${loader}:${minecraftVersion}").tasks.named('remapJar')
                    .flatMap { it.archiveFile }
            platforms = [platform]
            minecraft = minecraftVersion
            mixins = ['mixins.baritone.json']
        }
    }
}
